language: python
python:
  - "3.9"

services:
  - docker

env:
  global:
    # The image will be tagged with this name on Docker Hub
    - IMAGE_NAME=devops-challenge-2025

# The 'install' step is not needed because dependencies are handled
# within the Docker build process defined in docker-compose.yml.

script:
  # Run tests using the dedicated 'test' service
  - docker-compose run --rm test

after_success:
  # This section runs only after the 'script' section (tests) succeeds.
  # It builds the Docker image and pushes it to Docker Hub.
  #
  # IMPORTANT:
  # You must configure DOCKER_USERNAME and DOCKER_PASSWORD as secure
  # environment variables in your Travis CI repository settings for this to work.
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - docker build -t "$DOCKER_USERNAME/$IMAGE_NAME" .
  - docker push "$DOCKER_USERNAME/$IMAGE_NAME"
